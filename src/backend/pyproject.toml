[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techbondhu-api"
version = "0.1.0"
description = "FastAPI backend for TechBondhu"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "supabase>=2.15,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

